# Netlify build — use ONLY relative paths (no /opt/build/repo, no leading slash).
# In Netlify UI: do not set "Publish directory" or "Functions directory" to an absolute path,
# or clear them so this file is used.

[build]
  command = "npm install"
  publish = "public"

[build.environment]
  NODE_VERSION = "18"

# Chat API: rewrite /api/chat to the serverless function so the frontend gets JSON
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true
